id = "thientrile.wake"
name = "herdr-wake"
version = "0.1.1"
min_herdr_version = "0.9.1"
description = "Durable wake-up queue and one delivery worker for herdr agent panes; gh-watch and hjob enqueue, the worker prompts the pane."
platforms = ["linux"]

[[actions]]
id = "install-cli"
title = "herdr-wake: put the wake command on PATH (~/.local/bin)"
contexts = ["global"]
command = ["sh", "install-cli.sh"]

[[actions]]
id = "status"
title = "herdr-wake: status"
contexts = ["global"]
command = ["python3", "-I", "wake", "status"]
